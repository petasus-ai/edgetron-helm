apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: imagevolume-cloner
rules:
- apiGroups: ["cdi.kubevirt.io"]
  resources: ["datavolumes/source"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-clone-to-user
  namespace: imagevolume
subjects:
- kind: ServiceAccount
  name: default
  namespace: default
roleRef:
  kind: ClusterRole
  name: imagevolume-cloner
  apiGroup: rbac.authorization.k8s.io
