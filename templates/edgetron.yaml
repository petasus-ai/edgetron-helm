{{- /*
The account ks-apiserver takes edgetron tokens with, and the key edgetron
signs them with. ks-apiserver reads this Secret itself, so nothing else has
to carry the values. Given values win; otherwise the current Secret's are
kept, and the first install generates them. Computed once here, so the pod
annotation below changes, and edgetron restarts, exactly when they do.
*/ -}}
{{- $authSecret := .Values.auth.existingSecret | default "edgetron-auth" }}
{{- $current := (lookup "v1" "Secret" .Release.Namespace $authSecret).data | default dict }}
{{- $authData := $current }}
{{- if not .Values.auth.existingSecret }}
{{- $authData = dict
      "username" (.Values.auth.username | b64enc)
      "password" (ternary (.Values.auth.password | toString | b64enc) (index $current "password" | default (randAlphaNum 40 | b64enc)) (not (empty .Values.auth.password)))
      "jwt-secret" (ternary (.Values.auth.jwtSecret | toString | b64enc) (index $current "jwt-secret" | default (randAlphaNum 64 | b64enc)) (not (empty .Values.auth.jwtSecret))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $authSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: edgetron
type: Opaque
data:
  jwt-secret: {{ index $authData "jwt-secret" }}
  username: {{ index $authData "username" }}
  password: {{ index $authData "password" }}
---
{{- end }}
{{- /*
Read-only accounts for the other apps in the cluster: one key per account,
its password the value. edgetron reads the mounted Secret at each login, so
an account comes or goes without a restart. Given passwords win; otherwise
the current Secret's are kept, and a new account gets one generated. With no
auth.readers the chart leaves edgetron-readers alone: one made by hand works too.
*/ -}}
{{- $readersSecret := "edgetron-readers" }}
{{- with .Values.auth.readers }}
{{- $currentReaders := (lookup "v1" "Secret" $.Release.Namespace $readersSecret).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $readersSecret }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: edgetron
type: Opaque
data:
  {{- range . }}
  {{- if or (eq .name $.Values.auth.username) (hasPrefix "." .name) }}
  {{- fail (printf "auth.readers: %q cannot be a read-only account's name" .name) }}
  {{- end }}
  {{ .name }}: {{ ternary (.password | toString | b64enc) (index $currentReaders .name | default (randAlphaNum 40 | b64enc)) (not (empty .password)) }}
  {{- end }}
---
{{- end }}
# Include a clusterrole for the edgetron Deployment,
# and bind it to the edgetron serviceaccount.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgetron
  labels:
    app: edgetron
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: edgetron
  template:
    metadata:
      labels:
        app: edgetron
      annotations:
        checksum/auth: {{ toJson $authData | sha256sum }}
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - edgetron
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: cluster-configs
          hostPath:
            path: /tmp/cluster-configs
            type: DirectoryOrCreate
        - name: readers
          secret:
            secretName: {{ $readersSecret }}
            optional: true
        {{- if .Values.persistence.enabled }}
        - name: helm-pv-storage
          persistentVolumeClaim:
            claimName: edgetron-helm
        {{- end }}
      serviceAccountName: provider-api
      containers:
        - name: edgetron
          image: {{ .Values.edgetronImage.registry }}/{{ .Values.edgetronImage.repository }}:{{ .Values.edgetronImage.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.edgetronImage.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: EDGETRON_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecret }}
                  key: jwt-secret
            - name: EDGETRON_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecret }}
                  key: username
            - name: EDGETRON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecret }}
                  key: password
            - name: EDGETRON_ACCESS_TOKEN_TTL_SECONDS
              value: {{ .Values.auth.accessTokenTTLSeconds | quote }}
            - name: EDGETRON_REFRESH_TOKEN_TTL_SECONDS
              value: {{ .Values.auth.refreshTokenTTLSeconds | quote }}
            {{- if .Values.pullAgent.enabled }}
            - name: PULL_AGENT_PORT
              value: {{ .Values.pullAgent.port | quote }}
            {{- end }}
          volumeMounts:
            - mountPath: /tmp/cluster-configs
              name: cluster-configs
              readOnly: false
            - mountPath: /etc/edgetron/readers
              name: readers
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - mountPath: /root/.cache/helm/repository
              name: helm-pv-storage
              readOnly: false
            {{- end }}
          {{- if .Values.resources }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          {{- end }}
        - name: watcher
          image: {{ .Values.edgetronWatcherImage.registry }}/{{ .Values.edgetronWatcherImage.repository }}:{{ .Values.edgetronWatcherImage.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.edgetronWatcherImage.pullPolicy }}
          volumeMounts:
            - mountPath: /tmp/cluster-configs
              name: cluster-configs
              readOnly: false
            {{- if .Values.persistence.enabled }}
            - mountPath: /root/.cache/helm/repository
              name: helm-pv-storage
              readOnly: false
            {{- end }}
          {{- if .Values.resources }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          {{- end }}
      {{- if .Values.images.pullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.images.pullSecrets }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: edgetron-service
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: edgetron
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: 8080
      nodePort: {{ .Values.service.nodePort }}
