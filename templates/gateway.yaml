apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edgetron-gateway
  namespace: edgestack-system
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: document-ingress-all-hosts
  namespace: edgestack-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edgetron-gateway
      namespace: edgestack-system
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: document-service
          port: 3000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
    # The API docs only. The API itself is reached through ks-apiserver,
    # which authorizes each request and tells edgetron its project scope.
    - backendRefs:
        - group: ""
          kind: Service
          name: edgetron-service
          port: 8080
          weight: 1
      matches:
        - path:
            type: Exact
            value: /edgetron/docs
        - path:
            type: Exact
            value: /edgetron/redoc
        - path:
            type: Exact
            value: /edgetron/v1/openapi.json
        - path:
            type: PathPrefix
            value: /edgetron/static
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: document-ingress-default-backend
  namespace: edgestack-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edgetron-gateway
      namespace: edgestack-system
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: document-service
          port: 3000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
