apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edgetron-gateway
  namespace: edgestack-system
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: document-ingress-all-hosts
  namespace: edgestack-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edgetron-gateway
      namespace: edgestack-system
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: document-service
          port: 3000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
    # The API docs. The API itself is reached through ks-apiserver, which
    # authorizes each request and tells edgetron its project scope, and with
    # read-only accounts through edgetron-api-read below.
    - backendRefs:
        - group: ""
          kind: Service
          name: edgetron-service
          port: 8080
          weight: 1
      matches:
        - path:
            type: Exact
            value: /edgetron/docs
        - path:
            type: Exact
            value: /edgetron/redoc
        - path:
            type: Exact
            value: /edgetron/v1/openapi.json
        - path:
            type: PathPrefix
            value: /edgetron/static
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: document-ingress-default-backend
  namespace: edgestack-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edgetron-gateway
      namespace: edgestack-system
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: document-service
          port: 3000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
{{- if .Values.gateway.readOnlyApi }}
---
# The API for read-only accounts from outside the cluster, so the docs page's
# Try it out works: logging in, GET, and POST for the placement dry-runs
# (edgetron refuses a read-only token every other POST). The header tells
# edgetron the request came through here, and it then takes read-only accounts
# only; set, it overwrites whatever the client sent.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: edgetron-api-read
  namespace: edgestack-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edgetron-gateway
      namespace: edgestack-system
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: edgetron-service
          port: 8080
          weight: 1
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Edgetron-Gateway
                value: read-only
      matches:
        - path:
            type: Exact
            value: /edgetron/auth/generate_token
          method: POST
        - path:
            type: Exact
            value: /edgetron/auth/refresh_token
          method: POST
        - path:
            type: PathPrefix
            value: /edgetron/resources
          method: GET
        - path:
            type: PathPrefix
            value: /edgetron/resources
          method: POST
        - path:
            type: PathPrefix
            value: /edgetron/licenses
          method: GET
{{- end }}
