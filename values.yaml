images: {}
edgetronImage:
  registry: registry.tde.sktelecom.com
  repository: petasus/edgetron
  tag: latest
  pullPolicy: IfNotPresent

edgetronWatcherImage:
  registry: registry.tde.sktelecom.com
  repository: petasus/edgetron/watcher
  tag: latest
  pullPolicy: IfNotPresent

vmEventImage:
  registry: registry.tde.sktelecom.com
  repository: petasus/vm-event-operator
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

# The account ks-apiserver takes edgetron tokens with and the key edgetron
# signs them with, kept in the Secret edgetron-auth (keys jwt-secret, username,
# password). ks-apiserver reads that Secret itself.
auth:
  # A Secret of your own with those keys; the chart then creates none.
  existingSecret: ""
  username: edgetron
  # Left empty, the password and the signing key keep the Secret's current
  # values, or are generated on the first install.
  password: ""
  jwtSecret: ""
  accessTokenTTLSeconds: 3600
  refreshTokenTTLSeconds: 86400
  # Read-only accounts for other apps in the cluster, kept in the Secret
  # edgetron-readers: they read everything but a cluster's kubeconfig, its
  # etcd snapshots and the license key, and run the placement dry-runs. An
  # empty password keeps the Secret's current one or generates one; hand it to
  # the app from
  #   kubectl -n <namespace> get secret edgetron-readers -o jsonpath='{.data.<name>}' | base64 -d
  # Each app's pods also go in networkPolicy.extraIngressFrom.
  readers: []
  # - name: inventory-app
  #   password: ""

gateway:
  # Route the API to edgetron for read-only accounts from outside the cluster
  # (logging in, GET, and POST for the placement dry-runs), so Try it out on
  # /edgetron/docs works. edgetron takes no other account through the Gateway.
  readOnlyApi: true

# Only ks-apiserver, the Gateway (the API docs, and the read-only API with
# gateway.readOnlyApi) and the extraIngressFrom peers reach edgetron.
networkPolicy:
  enabled: true
  apiserver:
    namespace: petasus-system
    podLabels:
      app: ks-apiserver
  gateway:
    # nginx-gateway-fabric 2.x labels the data plane pods it provisions in the
    # Gateway's namespace with the Gateway's name.
    podLabels:
      gateway.networking.k8s.io/gateway-name: edgetron-gateway
  # More NetworkPolicyPeers allowed to reach edgetron, such as the apps given
  # read-only accounts (auth.readers):
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: inventory
  #     podSelector:
  #       matchLabels:
  #         app: inventory-app
  extraIngressFrom: []

resources:
  limits: {}
  requests:
    memory: 1024Mi
    cpu: 500m

persistence:
  enabled: false
  persistentVolumeClaim:
    helm:
      existingClaim: ""
      storageClass: longhorn-master
      accessMode: ReadWriteMany
      size: 1Gi
  imageChartStorage:
    type: filesystem
