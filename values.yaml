images: {}
edgetronImage:
  registry: registry.tde.sktelecom.com
  repository: petasus/edgetron
  tag: latest
  pullPolicy: IfNotPresent

edgetronWatcherImage:
  registry: registry.tde.sktelecom.com
  repository: petasus/edgetron/watcher
  tag: latest
  pullPolicy: IfNotPresent

vmEventImage:
  registry: registry.tde.sktelecom.com
  repository: petasus/vm-event-operator
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

ingress:
  authentication:
    authType: basic
    authSecret: basic-auth
    authRealm: 'Authentication Required - edgetron'
  http:
    pathType: Prefix

resources:
  limits: {}
  requests:
    memory: 1024Mi
    cpu: 500m

persistence:
  enabled: false
  persistentVolumeClaim:
    helm:
      existingClaim: ""
      storageClass: longhorn-master
      accessMode: ReadWriteMany
      size: 1Gi
  imageChartStorage:
    type: filesystem
